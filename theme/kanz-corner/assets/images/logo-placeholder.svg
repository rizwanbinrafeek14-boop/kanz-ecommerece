<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none" role="img" aria-label="Kanz Corner Trading">
  <defs>
    <linearGradient id="kcGreyArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A6ABB3"/>
      <stop offset="100%" stop-color="#16181B"/>
    </linearGradient>
  </defs>

  <!-- monogram -->
  <g transform="translate(4,10)">
    <!-- small navy pipe-elbow accent -->
    <path d="M2 0 L2 14 L12 14 L12 22" stroke="#10121C" stroke-width="3.5" fill="none" stroke-linecap="square"/>
    <!-- red bar (the "K" stem) -->
    <path d="M18 0 C28 0 34 6 34 16 L34 54 C34 64 28 70 18 70 L18 0 Z" fill="#A6242E"/>
    <!-- grey gradient "C" pipe -->
    <path d="M46 35 a26 26 0 1 1 18 25" stroke="url(#kcGreyArc)" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="112" y="42" font-family="Cairo, Arial, sans-serif" font-weight="800" font-size="26" fill="#10121C">KANZ <tspan fill="#565B63" font-weight="700">CORNER</tspan></text>
  <text x="112" y="62" font-family="Cairo, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="4" fill="#A6242E">TRADING</text>
</svg>
